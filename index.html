<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Metrópole Tokenizada - Protótipo 3D</title>
    <style>
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #0d1117;
            user-select: none;
            -webkit-user-select: none;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-family: sans-serif;
            pointer-events: none;
            background: rgba(0,0,0,0.5);
            padding: 15px;
            border-radius: 8px;
            z-index: 10;
        }
        /* 🕹️ ESTILIZAÇÃO DO JOYSTICK MOBILE */
        #joystick-container {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            backdrop-filter: blur(4px);
            z-index: 20;
            display: block; /* Visível em todas as telas para testes */
            touch-action: none;
        }
        #joystick-knob {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 50px;
            height: 50px;
            background: rgba(88, 166, 255, 0.8);
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            touch-action: none;
            transition: transform 0.05s ease;
        }
    </style>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body>

    <div id="ui-layer">
        <h2 style="margin:0 0 5px 0;">Metrópole Tokenizada</h2>
        <p style="margin:0;">Status: <span style="color:#ff7b72;">Desempregado</span></p>
        <p style="margin:5px 0 0 0; font-size:12px; color:#8b949e;">Teclado: WASD | Celular: Arraste o Analógico</p>
    </div>

    <div id="joystick-container">
        <div id="joystick-knob"></div>
    </div>

    <canvas id="renderCanvas"></canvas>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);

        // Variáveis globais para o controle Mobile
        let mobileVector = { x: 0, y: 0 };
        let isMobileMoving = false;

        const createScene = function () {
            const scene = new BABYLON.Scene(engine);
            
            scene.clearColor = new BABYLON.Color4(0.05, 0.07, 0.09, 1);
            scene.collisionsEnabled = true;
            scene.gravity = new BABYLON.Vector3(0, -0.1, 0);

            const skyLight = new BABYLON.HemisphericLight("skyLight", new BABYLON.Vector3(0, 1, 0), scene);
            skyLight.intensity = 0.6;
            const dirLight = new BABYLON.DirectionalLight("dirLight", new BABYLON.Vector3(-1, -2, -1), scene);
            dirLight.intensity = 0.4;

            // 🛡️ CHÃO DE SEGURANÇA MÁXIMA
            const heavyGround = BABYLON.MeshBuilder.CreateBox("heavyGround", {width: 500, height: 2, depth: 500}, scene);
            heavyGround.position.y = -1;
            const groundMat = new BABYLON.StandardMaterial("groundMat", scene);
            groundMat.alpha = 0;
            heavyGround.material = groundMat;
            heavyGround.checkCollisions = true;

            // 1. CARREGAR A CIDADE DO BLENDER (Focando no objeto teimoso car1)
            BABYLON.SceneLoader.ImportMesh("", "assets/", "city.glb", scene, function (meshes) {
                if(meshes[0]) meshes[0].position = BABYLON.Vector3.Zero(); 
                meshes.forEach(mesh => {
                    if (mesh.geometry) mesh.checkCollisions = true;

                    if (mesh.name.toLowerCase().includes("car1")) {
                        mesh.checkCollisions = true;
                        mesh.convertToFlatShadedMesh(); 
                        const boundInfo = mesh.getBoundingInfo();
                        const extendSize = boundInfo.boundingBox.extendSizeWorld;
                        const autoCollider = BABYLON.MeshBuilder.CreateBox("autoCollider", {
                            width: extendSize.x * 2, height: extendSize.y * 2, depth: extendSize.z * 2
                        }, scene);
                        autoCollider.position = boundInfo.boundingBox.centerWorld;
                        autoCollider.checkCollisions = true;
                        const transparentMat = new BABYLON.StandardMaterial("transMat", scene);
                        transparentMat.alpha = 0; 
                        autoCollider.material = transparentMat;
                    }
                });
            });

            // 2. CRIAR O AVATAR DO JOGADOR
            let player = BABYLON.MeshBuilder.CreateBox("playerPlaceholder", {size: 1.5}, scene);
            player.position = new BABYLON.Vector3(0, 1.1, 0);
            player.visibility = 0;

            player.checkCollisions = true;
            player.applyGravity = true;
            player.ellipsoid = new BABYLON.Vector3(0.4, 1.0, 0.4);
            player.ellipsoidOffset = new BABYLON.Vector3(0, 1.0, 0);

            let playerMesh = null;
            let idleAnim = null;
            let walkAnim = null;
            let isPlayingWalk = false;

            BABYLON.SceneLoader.ImportMesh("", "assets/", "player.glb", scene, function (newMeshes, particleSystems, skeletons, animationGroups) {
                newMeshes.forEach(mesh => {
                    mesh.setEnabled(true);
                    mesh.isVisible = true;
                });

                playerMesh = newMeshes[0];
                playerMesh.parent = player;
                playerMesh.position = BABYLON.Vector3.Zero(); 
                playerMesh.scaling = new BABYLON.Vector3(1, 1, 1);
                playerMesh.rotationQuaternion = null; 
                playerMesh.rotation = new BABYLON.Vector3(0, 0, 0); // Ajustado para correr para frente

                if (animationGroups.length > 0) {
                    animationGroups.forEach(anim => anim.stop());
                    idleAnim = animationGroups[0];
                    walkAnim = animationGroups[1] ? animationGroups[1] : animationGroups[0];
                    if (idleAnim) idleAnim.start(true, 1.0, idleAnim.from, idleAnim.to, false);
                }
            }, null, null, ".glb");

            // 3. CÂMERA EM TERCEIRA PESSOA
            const camera = new BABYLON.ArcRotateCamera("gtaCamera", -Math.PI / 2, Math.PI / 3, 15, player.position, scene);
            camera.attachControl(canvas, true);
            camera.lockedTarget = player; 
            camera.upperBetaLimit = Math.PI / 2.1;
            camera.lowerRadiusLimit = 4;
            camera.upperRadiusLimit = 30;

            // 4. CONFIGURAÇÃO DE INPUTS DO TECLADO
            const inputMap = {};
            const playerSpeed = 0.15;

            window.addEventListener("keydown", (evt) => { inputMap[evt.key.toLowerCase()] = true; });
            window.addEventListener("keyup", (evt) => { inputMap[evt.key.toLowerCase()] = false; });

            // ==========================================
            // 5. LOOP DE MOVIMENTAÇÃO HÍBRIDO (PC + MOBILE)
            // ==========================================
            scene.onBeforeRenderObservable.add(() => {
                let moveVector = new BABYLON.Vector3(0, 0, 0);
                let isMoving = false;

                let forward = camera.getFrontPosition(1).subtract(camera.position);
                forward.y = 0;
                forward.normalize();

                let right = BABYLON.Vector3.Cross(forward, BABYLON.Vector3.Up());
                right.y = 0;
                right.normalize();

                // CONTROLES DO TECLADO (PC)
                if (inputMap["w"] || inputMap["arrowup"]) { moveVector = moveVector.add(forward.scale(playerSpeed)); isMoving = true; }
                if (inputMap["s"] || inputMap["arrowdown"]) { moveVector = moveVector.subtract(forward.scale(playerSpeed)); isMoving = true; }
                if (inputMap["a"] || inputMap["arrowleft"]) { moveVector = moveVector.add(right.scale(playerSpeed)); isMoving = true; }
                if (inputMap["d"] || inputMap["arrowright"]) { moveVector = moveVector.subtract(right.scale(playerSpeed)); isMoving = true; }

                // CONTROLES DO JOYSTICK (MOBILE)
                if (isMobileMoving) {
                    let mobileForward = forward.scale(-mobileVector.y * playerSpeed);
                    let mobileRight = right.scale(-mobileVector.x * playerSpeed);
                    moveVector = moveVector.add(mobileForward).add(mobileRight);
                    isMoving = true;
                }

                moveVector.y = scene.gravity.y;
                player.moveWithCollisions(moveVector);

                // Gerenciador de Animações Humana
                if (isMoving) {
                    let targetAngle = Math.atan2(moveVector.x, moveVector.z);
                    player.rotation.y = targetAngle;

                    if (!isPlayingWalk && walkAnim) {
                        if (idleAnim) idleAnim.stop();
                        walkAnim.start(true, 1.0, walkAnim.from, walkAnim.to, false);
                        isPlayingWalk = true;
                    }
                } else {
                    if (isPlayingWalk && idleAnim) {
                        if (walkAnim) walkAnim.stop();
                        idleAnim.start(true, 1.0, idleAnim.from, idleAnim.to, false);
                        isPlayingWalk = false;
                    }
                }
            });

            return scene;
        };

        const scene = createScene();
        engine.runRenderLoop(function () { scene.render(); });
        window.addEventListener("resize", function () { engine.resize(); });

        // ==========================================
        // ⚙️ LÓGICA DE CAPTURA DO TOQUE DO JOYSTICK
        // ==========================================
        const container = document.getElementById("joystick-container");
        const knob = document.getElementById("joystick-knob");
        const maxRadius = 40; // Limite máximo de arrasto da bolinha

        container.addEventListener("touchstart", handleStart, { passive: false });
        window.addEventListener("touchmove", handleMove, { passive: false });
        window.addEventListener("touchend", handleEnd);

        function handleStart(e) { e.preventDefault(); }

        function handleMove(e) {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = container.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            let deltaX = touch.clientX - centerX;
            let deltaY = touch.clientY - centerY;
            const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);

            if (distance > maxRadius) {
                deltaX = (deltaX / distance) * maxRadius;
                deltaY = (deltaY / distance) * maxRadius;
            }

            knob.style.transform = `translate(${deltaX}px, ${deltaY}px)`;

            // Normaliza os valores entre -1 e 1 para passar para o motor de física
            mobileVector.x = deltaX / maxRadius;
            mobileVector.y = deltaY / maxRadius;
            isMobileMoving = true;
        }

        function handleEnd() {
            knob.style.transform = "translate(0px, 0px)";
            mobileVector = { x: 0, y: 0 };
            isMobileMoving = false;
        }
    </script>
</body>
</html>
